services:
  leaves:
    build: .
    ports:
      - "8080:8080"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.113.103:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    volumes:
      - library:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  library:
